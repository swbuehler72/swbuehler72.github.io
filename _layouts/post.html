---
layout: default
---
<article>
  <header class="post-header">
    <div class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% if page.tags.size > 0 %}
        &bull; 
        <span class="post-tags" style="margin-left: 0;">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>
