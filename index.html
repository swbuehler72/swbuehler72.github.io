---
layout: default
---
<section class="posts">
    <h1>Steven Watson Buehler</h1>
    <p style="margin-bottom: 1em;">A <em>gloriously</em> awkward fifty-something. This is my random blog.</p>
    <ul>
        {% for post in site.posts %}
        <li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a><time
                datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time></li>
        {% endfor %}
    </ul>
</section>
